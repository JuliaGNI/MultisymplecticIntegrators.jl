# The test groups of runtests.jl; GROUPS in runtests.jl lists the same groups, and an empty ARGS
# runs them all. `split = false` runs all groups of a CI matrix entry in one job, which names them
# in ARGS. `once` names the groups that a pull request and a push run on Ubuntu with Julia 1 only;
# the weekly run, a tag and a run by hand run every group on every entry.
groups = ["core", "quality", "slow", "ansatz", "couplings", "initialguess", "verification", "fixedboundary"]
split = false
once = ["quality", "verification"]
